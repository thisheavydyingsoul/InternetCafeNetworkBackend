spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/internet_cafe_db
    username: internet_cafe_user
    password: internet_cafe_pass
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true