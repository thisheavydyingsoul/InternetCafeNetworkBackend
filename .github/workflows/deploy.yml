name: Backend deploy

on:
  workflow_call:
    inputs:
      image_tag:
        description: Immutable backend image tag
        required: true
        type: string

      source_sha:
        description: Commit SHA validated by CI
        required: true
        type: string

      environment:
        required: true
        type: string

      ref:
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-${{ inputs.environment }}-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: backend-build-and-push-${{ inputs.environment }}
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout CI-validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - name: Verify source version
        shell: bash
        run: |
          set -euo pipefail
          echo "Expected SHA: ${{ inputs.source_sha }}"
          echo "Actual SHA:   $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define immutable image tag
        id: meta
        run: |
          set -euo pipefail
          echo "image_tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/internet-cafe-api:${{ steps.meta.outputs.image_tag }}

  deploy:
    name: backend-deploy-${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: ${{ inputs.environment }}
      url: http://${{ vars.HOST }}:8080/api/actuator/health

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Deploy to ${{ inputs.environment }} VM
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/internet-cafe-api:${{ needs.build-and-push.outputs.image_tag }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          COMPOSE_FILE: docker-compose-${{ inputs.environment }}.yml
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: BACKEND_IMAGE,GHCR_TOKEN,GHCR_USER,DEPLOY_PATH,COMPOSE_FILE
          script: |
            cd "${DEPLOY_PATH}"
            git fetch origin dev
            git checkout dev
            git pull --ff-only origin dev
            bash deploy/scripts/deploy.sh

  backend-smoke:
    name: backend-smoke
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Health check via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            
            set -a
            source /opt/internet-cafe-${{ inputs.environment }}/docker/.env
            set +a
            
            curl --fail --show-error --retry 5 --retry-delay 5 \
              -u "actuator:${ACTUATOR_PASSWORD}" \
              http://localhost:8080/api/actuator/health






