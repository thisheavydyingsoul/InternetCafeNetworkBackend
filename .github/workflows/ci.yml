name: Backend CI

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "hotfix/**"
      - dev
      - main
    
  pull_request:
    branches:
      - dev
      - main

  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: backend-unit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run unit tests
        run: ./mvnw --batch-mode test


  backend-build:
    name: backend-build
    runs-on: ubuntu-latest
    needs:
      - backend-unit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build JAR
        run: ./mvnw --batch-mode package -DskipTests

  backend-integration:
    name: backend-integration
    runs-on: ubuntu-latest
    needs: backend-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run PostgreSQL integration tests
        run: ./mvnw --batch-mode verify -Pintegration

  backend-docker-build:
    name: backend-docker-build
    runs-on: ubuntu-latest
    needs: backend-build

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Define immutable image tag
        id: meta
        shell: bash
        run: |
          echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Verify image tag
        shell: bash
        run: |
          test -n "${{ steps.meta.outputs.image_tag }}"
          echo "Will publish tag: ${{ steps.meta.outputs.image_tag }}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/internet-cafe-api:${{ steps.meta.outputs.image_tag }}

  backend-security:
    name: backend-security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-deploy:
    name: backend-deploy
    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    needs:
      - backend-integration
      - backend-docker-build
      - backend-security

    uses: ./.github/workflows/deploy.yml

    with:
      environment: ${{ github.ref_name == 'dev' && 'staging' || github.ref_name == 'main' && 'production' || '' }}
      ref: ${{ github.ref_name }}
      image_tag: ${{ needs.backend-docker-build.outputs.image_tag }}
      source_sha: ${{ github.sha }}
