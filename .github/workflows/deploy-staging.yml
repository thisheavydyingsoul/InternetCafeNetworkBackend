name: Backend deploy staging

on:
  workflow_run:
    workflows: ["Backend CI"]
    branches: [dev]
    types: completed

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-staging-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: backend-build-and-push-staging
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define immutable image tag
        id: meta
        run: echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/internet-cafe-api:${{ steps.meta.outputs.image_tag }}

  deploy-staging:
    name: backend-deploy-staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
      url: http://${{ vars.STAGING_HOST }}:8080/api/actuator/health

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy to staging VM
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/internet-cafe-api:${{ needs.build-and-push.outputs.image_tag }}
          GHCR_TOKEN: ${{ secrets.STAGING_GHCR_TOKEN }}
          GHCR_USER: ${{ secrets.STAGING_GHCR_USER }}
          STAGING_DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          envs: BACKEND_IMAGE,GHCR_TOKEN,GHCR_USER,STAGING_DEPLOY_PATH
          script: |
            cd "${STAGING_DEPLOY_PATH}"
            git fetch origin dev
            git checkout dev
            git pull --ff-only origin dev
            bash deploy/scripts/deploy-staging.sh

  backend-staging-smoke:
    name: backend-staging-smoke
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
      - name: Health check via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          script: |
            set -a
            source /opt/internet-cafe-staging/docker/.env
            set +a
            curl --fail --retry 5 --retry-delay 5 \
              -u "actuator:${ACTUATOR_PASSWORD}" \
              http://localhost:8080/api/actuator/health






