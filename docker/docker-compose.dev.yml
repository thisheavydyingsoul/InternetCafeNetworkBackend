services:
  postgres:
    image: postgres:15-alpine
    container_name: internet-cafe-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-internet_cafe_db}
      POSTGRES_USER: ${POSTGRES_USER:-internet_cafe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-internet_cafe_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-internet_cafe_user} -d ${POSTGRES_DB:-internet_cafe_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    command:
      - postgres
      - -c
      - wal_level=logical
    networks:
      - internet-cafe-network-dev

  redis:
    image: redis:7-alpine
    container_name: internet-cafe-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - internet-cafe-network-dev

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: internet-cafe-zookeeper-dev
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok"
    ports:
      - "2181:2181"
    volumes:
        - zookeeper_data_dev:/var/lib/zookeeper/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo ruok | nc -w 2 localhost 2181 | grep -q '^imok$'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - internet-cafe-network-dev

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: internet-cafe-kafka-dev
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data_dev:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server kafka:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 90s
    networks:
      - internet-cafe-network-dev

  backend:
    image: ${DOCKER_USERNAME:-internetcafe}/internetcafe-backend:dev-latest
    container_name: internet-cafe-backend-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: staging
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-internet_cafe_db}
      POSTGRES_USER: ${POSTGRES_USER:-internet_cafe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MAIL_HOST: ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME is required}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD is required}
      MAIL_FROM: ${MAIL_FROM:-noreply@example.com}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      SERVER_PORT: 8080

    ports:
      - "8080:8080"
    networks:
      - internet-cafe-network-dev

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: internet-cafe-pgadmin-dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?PGADMIN_EMAIL is required}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD is required}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internet-cafe-network-dev

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: internet-cafe-kafka-ui-dev
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - internet-cafe-network-dev

volumes:
  postgres_data_dev:
  redis_data_dev:
  kafka_data_dev:
  zookeeper_data_dev:

networks:
  internet-cafe-network-dev:
    driver: bridge